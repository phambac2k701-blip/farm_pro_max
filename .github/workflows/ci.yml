name: Chapter 1 production CI

on:
  push:
    branches:
      - integration/narrative-v1.2
  pull_request:
    branches:
      - prototype/bootstrap-3d
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ch01-production-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Browser boot smoke
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/ch01-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          google-chrome --headless=new --no-sandbox --use-angle=swiftshader --enable-webgl --ignore-gpu-blocklist --virtual-time-budget=5000 --dump-dom http://127.0.0.1:5173/ > /tmp/ch01-dom.html
          grep -q 'data-scene-ready="ch01-production-shell"' /tmp/ch01-dom.html
          grep -q 'data-pa-station-count="8"' /tmp/ch01-dom.html
          grep -q 'data-ninth-pa-station-enabled="false"' /tmp/ch01-dom.html
